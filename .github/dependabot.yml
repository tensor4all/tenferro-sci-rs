version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    groups:
      tenferro:
        patterns: ["tenferro-*"]
    allow:
      - dependency-name: "tenferro-*"
      - dependency-name: "krylov"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
