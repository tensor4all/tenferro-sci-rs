name: checks

# Reusable job run by ci.yml (released tenferro) and upstream-main.yml
# (tenferro-rs main branch). Every step skips while the repository has no
# root Cargo.toml; the first PR that adds a crate makes them run.
on:
  workflow_call:
    inputs:
      tenferro:
        description: "`release` uses the versions pinned in Cargo.toml; `main` uses the tenferro-rs main branch."
        type: string
        default: release

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt, clippy, test, docs (${{ inputs.tenferro }})
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Detect the workspace
        id: ws
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No Cargo.toml yet; skipping the Rust gates."; fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.ws.outputs.present == 'true'
        with:
          components: rustfmt, clippy

      - name: Point tenferro crates at tenferro-rs main
        if: steps.ws.outputs.present == 'true' && inputs.tenferro == 'main'
        run: |
          sed -i -E 's#^(tenferro-[a-z-]+) = "[^"]+"#\1 = { git = "https://github.com/tensor4all/tenferro-rs", branch = "main" }#' Cargo.toml
          grep '^tenferro-' Cargo.toml || true
          echo "LOCKED=" >> "$GITHUB_ENV"

      - name: Use the committed lockfile
        if: steps.ws.outputs.present == 'true' && inputs.tenferro != 'main'
        run: echo "LOCKED=--locked" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        if: steps.ws.outputs.present == 'true'
        with:
          key: tenferro-${{ inputs.tenferro }}

      - name: cargo fmt
        if: steps.ws.outputs.present == 'true'
        run: cargo fmt --all --check

      - name: cargo clippy
        if: steps.ws.outputs.present == 'true'
        run: cargo clippy $LOCKED --workspace --all-targets -- -D warnings

      - name: cargo test
        if: steps.ws.outputs.present == 'true'
        run: cargo test --profile ci $LOCKED --workspace

      - name: cargo doc
        if: steps.ws.outputs.present == 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc $LOCKED --workspace --no-deps

  specials-no-default:
    name: specials without default features
    if: inputs.tenferro == 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: tenferro-${{ inputs.tenferro }}-no-default

      # `xprec` is a default feature. A suite gated as a whole file behind it
      # compiles to an empty binary and passes with `0 tests`, so the log is
      # checked: every suite under crates/specials/tests must run >= 1 test.
      - name: cargo test --no-default-features
        shell: bash
        run: |
          set -o pipefail
          cargo test --profile ci --locked -p specials --no-default-features 2>&1 | tee test.log

      - name: Require that every suite ran tests
        run: python3 scripts/assert_tests_ran.py test.log crates/specials/tests

  # The committed SciPy reference data of crates/minimize is regenerated with the versions pinned
  # in the script's inline metadata (SciPy 1.16.3, NumPy 2.3.5, Python 3.12) and compared:
  # ids, outcomes and counts exactly, floats within 1e-12 relative. Nothing is written.
  # setup-uv publishes no floating major tag any more, hence the exact version.
  minimize-reference:
    name: minimize reference data (SciPy 1.16.3)
    if: inputs.tenferro == 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Compare the regenerated line-search data with the committed CSVs
        run: uv run scripts/gen_minimize_linesearch_reference.py --check

      # The L-BFGS data (SciPy 1.16.3, NumPy 2.3.5, mpmath 1.3.0): path columns exactly, floats within 1e-8 relative or
      # 1e-12 absolute. The first Ubuntu/OpenBLAS run of this check is required before the implementation merges; if
      # the capped replay turns out brittle across platforms, shorten the prefix (the caps), never raise the constant.
      - name: Compare the regenerated L-BFGS data with the committed CSVs
        run: uv run scripts/gen_minimize_lbfgs_reference.py --check

      # The BFGS data (SciPy 1.16.3, NumPy 2.3.5, mpmath 1.3.0): counts, decisions and text exactly, floats within the replay
      # envelope (1e-8 relative to the run's maximum), diagnostic ratios against their bounds; a per-column summary on failure.
      - name: Compare the regenerated BFGS data with the committed CSVs
        run: uv run scripts/gen_minimize_bfgs_reference.py --check

  msrv:
    name: msrv
    if: inputs.tenferro == 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Read rust-version
        id: msrv
        run: |
          if [ -f Cargo.toml ]; then
            v=$(sed -n -E 's/^rust-version *= *"([^"]+)".*/\1/p' Cargo.toml | head -1)
            echo "version=$v" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"; echo "No Cargo.toml yet; skipping msrv."
          fi

      - uses: dtolnay/rust-toolchain@master
        if: steps.msrv.outputs.version != ''
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: cargo build at the MSRV
        if: steps.msrv.outputs.version != ''
        run: cargo build --profile ci --locked --workspace
